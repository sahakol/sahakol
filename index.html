<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ON ACTIVE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background-color: #111110;
      overflow-x: hidden;
    }

    .app-shell {
      width: 100%;
      min-height: 100dvh;
      background-color: #1f1e1d;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 640px) {
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: radial-gradient(circle at top, #262523 0%, #10100f 75%);
      }

      .app-shell {
        width: 390px;
        height: 844px;
        min-height: 844px;
        border-radius: 44px;
        box-shadow:
          0 25px 70px rgba(0, 0, 0, 0.75),
          0 0 0 8px #2b2a28,
          0 0 0 10px #161514;
      }
    }

    @keyframes spinArc {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .green-spinner {
      width: 44px;
      height: 44px;
      border-radius: 9999px;
      border: 4.5px solid transparent;
      border-top-color: #00e600;
      border-right-color: #00e600;
      animation: spinArc 0.78s linear infinite;
    }

    .btn-spinner {
      width: 24px;
      height: 24px;
      border-radius: 9999px;
      border: 3px solid rgba(255, 255, 255, 0.25);
      border-top-color: #123614;
      border-right-color: #123614;
      animation: spinArc 0.72s linear infinite;
    }

    .dark-ring-spinner {
      width: 54px;
      height: 54px;
      border-radius: 9999px;
      background: #2c2b29;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 0 7px #232220;
    }

    .dark-ring-spinner::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 9999px;
      border: 7px solid transparent;
      border-top-color: #00e600;
      animation: spinArc 0.85s linear infinite;
    }

    .dark-ring-spinner::after {
      content: "";
      width: 40px;
      height: 40px;
      border-radius: 9999px;
      background-color: #363533;
      z-index: 1;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fade-in-up {
      animation: fadeInUp 0.24s ease-out forwards;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Tablonun alt satıra kaymaması için tek satır ve kaydırma / daraltma ayarı */
    .single-line-clamp {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <div id="app" class="app-shell select-none"></div>

  <script>
    const state = {
      screen: 'splash',
      previousScreen: 'login',
      password: '',
      keypadOpen: false,
      submittingLogin: false,
      isTransitioning: false,
      balanceHidden: false,
      assetModalOpen: false,
      infoTooltipOpen: false,
      toastMessage: null,
      lang: 'TR'
    };

    let timers = [];
    let toastTimeout = null;

    function clearAllTimers() {
      timers.forEach((id) => clearTimeout(id));
      timers = [];
    }

    function schedule(fn, delay) {
      const id = setTimeout(fn, delay);
      timers.push(id);
      return id;
    }

    function showToast(msg) {
      state.toastMessage = msg;
      render();
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        state.toastMessage = null;
        render();
      }, 2400);
    }

    function navigateWithLoader(nextScreen, delay = 550) {
      if (state.isTransitioning) return;
      if (state.screen === nextScreen) {
        state.isTransitioning = true;
        render();
        setTimeout(() => {
          state.isTransitioning = false;
          render();
        }, delay);
        return;
      }

      state.isTransitioning = true;
      render();

      setTimeout(() => {
        state.previousScreen = state.screen;
        state.screen = nextScreen;
        state.assetModalOpen = false;
        state.infoTooltipOpen = false;
        state.isTransitioning = false;
        render();
      }, delay);
    }

    function triggerActionWithLoader(callback, delay = 550) {
      if (state.isTransitioning) return;
      state.isTransitioning = true;
      render();
      setTimeout(() => {
        state.isTransitioning = false;
        if (callback) callback();
        render();
      }, delay);
    }

    function startSplashFlow() {
      clearAllTimers();
      schedule(() => {
        if (state.screen === 'splash') {
          state.screen = 'login';
          render();
        }
      }, 1500);
    }

    function appendPasswordDigit(digit) {
      if (state.submittingLogin) return;
      if (state.password.length < 6) {
        state.password += String(digit);
        render();
      }
    }

    function deletePasswordDigit() {
      if (state.submittingLogin) return;
      if (state.password.length > 0) {
        state.password = state.password.slice(0, -1);
        render();
      }
    }

    function handleLoginSubmit() {
      if (state.submittingLogin) return;
      clearAllTimers();
      state.keypadOpen = false;
      state.submittingLogin = true;
      render();

      schedule(() => {
        state.submittingLogin = false;
        state.screen = 'loading_green';
        render();
      }, 750);

      schedule(() => {
        state.screen = 'loading_ring';
        render();
      }, 1450);

      schedule(() => {
        state.screen = 'home';
        render();
      }, 2150);
    }

    function renderTopSafeArea(theme = 'dark') {
      const bg = theme === 'light' ? 'bg-[#f7f8f7]' : 'bg-[#1f1e1d]';
      return `<div class="w-full pt-4 ${bg} shrink-0"></div>`;
    }

    function renderOnSwitchLogo(size = 'md') {
      if (size === 'splash') {
        return `
          <div class="inline-flex items-center bg-[#00e600] rounded-full px-1.5 py-1.5 shadow-[0_0_30px_rgba(0,230,0,0.22)]">
            <div class="w-14 h-12 bg-white rounded-full flex items-center justify-end pr-1.5 shadow-inner">
              <span class="w-9 h-9 rounded-full bg-[#191817] block"></span>
            </div>
            <span class="text-[#141312] font-black text-[34px] tracking-tighter leading-none pl-2 pr-3">ON</span>
          </div>
        `;
      }

      return `
        <div class="inline-flex items-center bg-[#00e600] rounded-full p-[3px] shadow-sm">
          <div class="w-7 h-6 bg-white rounded-full flex items-center justify-end pr-[3px]">
            <span class="w-[18px] h-[18px] rounded-full bg-[#191817] block"></span>
          </div>
          <span class="text-[#141312] font-black text-[17px] tracking-tighter leading-none pl-1 pr-2">ON</span>
        </div>
      `;
    }

    function renderTopHeader(mode = 'login') {
      const isLight = mode !== 'login';
      const headerBg = isLight ? 'bg-[#f7f8f7]' : 'bg-[#1f1e1d]';
      const iconColor = isLight ? 'text-[#181716]' : 'text-white';
      const dotBorder = isLight ? 'border-[#f7f8f7]' : 'border-[#1f1e1d]';

      return `
        <div class="w-full px-4 pt-1 pb-3 flex items-center justify-between ${headerBg} z-20">
          ${mode === 'login' ? `
            <button
              type="button"
              onclick="triggerActionWithLoader(() => { state.lang = state.lang === 'TR' ? 'EN' : 'TR'; showToast(state.lang === 'TR' ? 'Dil: Türkçe' : 'Language: English'); })"
              class="w-9 h-9 rounded-lg border border-white/60 text-white text-[11px] font-bold flex items-center justify-center active:scale-95 transition"
            >
              ${state.lang === 'TR' ? 'EN' : 'TR'}
            </button>
          ` : `
            <button
              type="button"
              onclick="triggerActionWithLoader(() => showToast('Tüm modüller aktif'))"
              class="w-9 h-9 rounded-lg ${iconColor} flex items-center justify-center active:scale-95 transition"
              aria-label="Menü"
            >
              <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <rect x="3.5" y="3.5" width="6.5" height="6.5" rx="1.5" />
                <rect x="14" y="3.5" width="6.5" height="6.5" rx="1.5" />
                <rect x="3.5" y="14" width="6.5" height="6.5" rx="1.5" />
                <circle cx="17.25" cy="17.25" r="3.25" />
              </svg>
            </button>
          `}

          <div class="inline-flex items-center bg-white rounded-full p-[2px] pr-3 shadow-sm border border-gray-200/80">
            ${renderOnSwitchLogo('sm')}
            <span class="ml-1.5 text-[#181716] font-extrabold text-[12px] tracking-wider">ACTIVE</span>
          </div>

          <button
            type="button"
            onclick="triggerActionWithLoader(() => showToast('Yeni bildiriminiz bulunmuyor'))"
            class="relative w-9 h-9 rounded-lg ${iconColor} flex items-center justify-center active:scale-95 transition"
            aria-label="Bildirimler"
          >
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 6h8M8 10h8M8 14h5" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 12v5a3 3 0 01-3 3H7a3 3 0 01-3-3V7a3 3 0 013-3h6" />
            </svg>
            <span class="w-2.5 h-2.5 rounded-full bg-[#16b938] border-2 ${dotBorder} absolute top-1.5 right-1.5"></span>
          </button>
        </div>
      `;
    }

    function renderSplashScreen() {
      return `
        <div class="flex-1 flex flex-col bg-[#1f1e1d]">
          ${renderTopSafeArea('dark')}
          <div onclick="navigateWithLoader('login')" class="flex-1 flex items-center justify-center cursor-pointer">
            <div class="fade-in-up">
              ${renderOnSwitchLogo('splash')}
            </div>
          </div>
          <div class="pb-3 flex justify-center">
            <div class="w-32 h-1 bg-white/80 rounded-full"></div>
          </div>
        </div>
      `;
    }

    function renderFxBanner() {
      return `
        <div class="mt-4 rounded-2xl overflow-hidden bg-gradient-to-r from-[#133b1d] via-[#1c692e] to-[#27a844] p-4 flex items-center justify-between shadow-md">
          <div class="flex flex-col items-start pr-2">
            <p class="text-white text-[13px] leading-snug font-medium">
              Çapraz döviz kurlarında<br />
              dar makas fırsatı <span class="font-bold">ON FX'te!</span>
            </p>
            <button
              type="button"
              onclick="navigateWithLoader('fx')"
              class="mt-3 bg-[#171615] text-white text-[10px] font-bold tracking-wider uppercase px-3 py-2 rounded-md inline-flex items-center gap-1.5 active:scale-95 transition"
            >
              <span>HEMEN KEŞFET</span>
              <span class="text-sm leading-none">→</span>
            </button>
          </div>
          <div class="relative flex items-center justify-end shrink-0 w-36 h-24">
            <div class="w-14 h-14 rounded-full bg-[#151413]/90 text-white flex flex-col items-center justify-center text-center shadow-lg border border-white/10 -mt-6 mr-[-14px] z-10">
              <span class="text-[11px] font-extrabold leading-tight">7/24</span>
              <span class="text-[9px] text-white/85 leading-tight">Canlı Kur</span>
            </div>
            <div class="w-12 h-12 rounded-full bg-gradient-to-br from-gray-100 via-gray-300 to-gray-500 border-2 border-gray-200 shadow-xl flex items-center justify-center text-gray-700 font-black text-xl z-20 -mr-2">$</div>
            <div class="w-12 h-12 rounded-full bg-gradient-to-br from-white via-gray-200 to-gray-400 border-2 border-gray-100 shadow-xl flex items-center justify-center text-gray-700 font-black text-xl z-30 mt-3">€</div>
          </div>
        </div>
      `;
    }

    function renderNumericKeypad() {
      const rows = [['1', '2', '3'], ['4', '5', '6'], ['7', '8', '9']];
      return `
        <div class="bg-[#2a2927] border-t border-white/10 px-3 pt-1.5 pb-2 z-30">
          <div class="flex items-center justify-end px-2 pb-1.5">
            <button type="button" onclick="state.keypadOpen = false; render();" class="text-[#22e022] font-semibold text-[15px] px-2 py-0.5 active:opacity-70">Tamam</button>
          </div>
          <div class="grid grid-cols-3 gap-1.5">
            ${rows.map((row) => row.map((num) => {
              const subLabels = { '1': '', '2': 'ABC', '3': 'DEF', '4': 'GHI', '5': 'JKL', '6': 'MNO', '7': 'PQRS', '8': 'TUV', '9': 'WXYZ' };
              return `
                <button type="button" onclick="appendPasswordDigit('${num}')" class="bg-[#3d3c3a] hover:bg-[#494845] active:bg-[#575653] text-white rounded-lg py-2 flex flex-col items-center justify-center shadow transition">
                  <span class="text-[20px] font-medium leading-none">${num}</span>
                  ${subLabels[num] ? `<span class="text-[9px] tracking-widest text-white/70 mt-0.5 font-semibold">${subLabels[num]}</span>` : `<span class="h-3"></span>`}
                </button>
              `;
            }).join('')).join('')}
            <button type="button" onclick="state.password = ''; render();" class="bg-[#2f2e2c] text-white/75 text-xs font-semibold rounded-lg py-2 flex items-center justify-center active:bg-[#3d3c3a]">Temizle</button>
            <button type="button" onclick="appendPasswordDigit('0')" class="bg-[#3d3c3a] hover:bg-[#494845] active:bg-[#575653] text-white rounded-lg py-2 flex items-center justify-center text-[20px] font-medium shadow transition">0</button>
            <button type="button" onclick="deletePasswordDigit()" class="bg-[#2f2e2c] text-white rounded-lg py-2 flex items-center justify-center active:bg-[#3d3c3a]" aria-label="Sil">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414-6.414a2 2 0 011.414-.586H19a2 2 0 012 2v10a2 2 0 01-2 2h-8.172a2 2 0 01-1.414-.586L3 12z" /></svg>
            </button>
          </div>
        </div>
      `;
    }

    function renderLoginScreen() {
      const maskedDisplay = state.password.length > 0 ? '•'.repeat(state.password.length) : '';
      return `
        <div class="flex-1 flex flex-col bg-[#1f1e1d] relative overflow-hidden">
          ${renderTopSafeArea('dark')}
          ${renderTopHeader('login')}
          <div class="flex-1 bg-white rounded-t-[28px] relative flex flex-col justify-between overflow-y-auto no-scrollbar">
            <div class="w-40 h-28 bg-[#1f1e1d] rounded-bl-[68px] absolute top-0 right-0 pointer-events-none"></div>
            <div class="px-6 pt-6 pb-4 relative z-10">
              <div class="flex items-start justify-between">
                <div>
                  <p class="text-[#18a82b] font-semibold text-[18px] leading-snug">Hoş geldin!</p>
                  <h1 class="text-[#181716] font-extrabold text-[26px] leading-tight mt-0.5">Furkan</h1>
                </div>
                <div class="relative mt-1">
                  <button type="button" onclick="triggerActionWithLoader(() => showToast('Profil bilgileri: Furkan Ç.'))" class="w-20 h-20 rounded-full border-[3.5px] border-[#00e600] bg-[#f4f6f4] flex items-center justify-center shadow-md active:scale-95 transition">
                    <span class="text-[#159e26] font-semibold text-[22px] tracking-wide">FÇ</span>
                  </button>
                  <span class="w-7 h-7 rounded-full bg-white border-2 border-[#00e600] text-[#159e26] flex items-center justify-center shadow absolute -bottom-0.5 -right-0.5">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg>
                  </span>
                </div>
              </div>
              <div class="mt-7">
                <div onclick="state.keypadOpen = true; render();" class="w-full h-14 px-4 rounded-xl border ${state.keypadOpen ? 'border-[#16a32a] ring-2 ring-[#00e600]/20' : 'border-gray-200'} bg-white flex items-center justify-between cursor-pointer transition">
                  <div class="flex items-center gap-1 min-w-0 flex-1">
                    ${maskedDisplay ? `<span class="text-[#181716] text-xl font-bold tracking-[0.22em]">${maskedDisplay}</span>` : `<span class="text-gray-400 text-[15px]">Şifre</span>`}
                    ${state.keypadOpen ? `<span class="w-[1.5px] h-5 bg-[#16a32a] ml-0.5"></span>` : ''}
                  </div>
                  <button type="button" onclick="event.stopPropagation(); triggerActionWithLoader(() => showToast('Şifre yenileme bağlantısı gönderildi.'));" class="text-[#d98a1c] font-semibold text-[14px] ml-3 shrink-0 active:opacity-70">Unuttum</button>
                </div>
                <button type="button" onclick="handleLoginSubmit()" class="mt-4 w-full h-13 py-3.5 rounded-xl bg-[#00e600] hover:bg-[#00d100] active:scale-[0.99] text-[#141312] font-bold text-[16px] flex items-center justify-center shadow-[0_6px_18px_rgba(0,230,0,0.28)] transition">
                  ${state.submittingLogin ? `<span class="btn-spinner"></span>` : `Giriş Yap`}
                </button>
              </div>
              ${renderFxBanner()}
            </div>
            <div class="bg-[#1d1c1b] rounded-t-[24px] px-4 pt-2.5 pb-4 text-white shrink-0">
              <div class="w-9 h-1 bg-white/25 rounded-full mx-auto mb-3.5"></div>
              <div class="grid grid-cols-3 gap-2 text-center">
                <button type="button" onclick="navigateWithLoader('transfer')" class="flex flex-col items-center py-1 rounded-xl active:bg-white/5 transition">
                  <span class="text-[#00e600] italic font-extrabold text-[15px] leading-tight">fast</span>
                  <span class="text-white/90 text-[12px] font-medium mt-1 leading-tight">FAST<br />İşlemleri</span>
                </button>
                <button type="button" onclick="triggerActionWithLoader(() => showToast('Bekleyen onay bulunmuyor'))" class="flex flex-col items-center py-1 rounded-xl active:bg-white/5 transition">
                  <svg class="w-6 h-6 text-[#00e600]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 12l2 2 4-4" /></svg>
                  <span class="text-white/90 text-[12px] font-medium mt-1 leading-tight">Bekleyen<br />Onaylar</span>
                </button>
                <button type="button" onclick="triggerActionWithLoader(() => showToast('QR tarayıcı hazır'))" class="flex flex-col items-center py-1 rounded-xl active:bg-white/5 transition">
                  <svg class="w-6 h-6 text-[#00e600]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4h6v6H4V4zm10 0h6v6h-6V4zM4 14h6v6H4v-6zm10 3h2v3h-2v-3zm4-3h2v6h-2v-6z" /></svg>
                  <span class="text-white/90 text-[12px] font-medium mt-1 leading-tight">QR<br />İşlemleri</span>
                </button>
              </div>
            </div>
          </div>
          ${state.keypadOpen ? renderNumericKeypad() : ''}
        </div>
      `;
    }

    function renderLoadingScreen(variant = 'green') {
      const isRing = variant === 'ring';
      return `
        <div class="flex-1 flex flex-col ${isRing ? 'bg-[#575654]' : 'bg-[#3d3c3a]'} transition-colors">
          ${renderTopSafeArea('dark')}
          <div class="flex-1 flex items-center justify-center">
            ${isRing ? `<div class="dark-ring-spinner"></div>` : `<div class="green-spinner"></div>`}
          </div>
        </div>
      `;
    }

    function renderBottomNav(activeTab = 'home') {
      return `
        <div class="bg-[#1d1c1b] px-2 pt-2.5 pb-3 border-t border-white/10 flex items-end justify-around text-center z-20 shrink-0">
          <button type="button" onclick="navigateWithLoader('home')" class="flex flex-col items-center justify-end w-16 active:scale-95 transition">
            <svg class="w-6 h-6 ${activeTab === 'home' ? 'text-[#00e600]' : 'text-white/75'}" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1v-9.5z" />
              <circle cx="9.5" cy="12.5" r="1" fill="currentColor" />
              <circle cx="14.5" cy="12.5" r="1" fill="currentColor" />
            </svg>
            <span class="text-[11px] mt-1 font-medium ${activeTab === 'home' ? 'text-[#00e600]' : 'text-white/75'}">Ana Sayfa</span>
          </button>
          <button type="button" onclick="navigateWithLoader('accounts')" class="flex flex-col items-center justify-end w-16 active:scale-95 transition">
            <svg class="w-6 h-6 ${activeTab === 'accounts' ? 'text-[#00e600]' : 'text-white/75'}" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 7.5A2.5 2.5 0 015.5 5h13A2.5 2.5 0 0121 7.5v9a2.5 2.5 0 01-2.5 2.5h-13A2.5 2.5 0 013 16.5v-9z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M16 12h5v3h-5a1.5 1.5 0 010-3z" />
            </svg>
            <span class="text-[11px] mt-1 font-medium ${activeTab === 'accounts' ? 'text-[#00e600]' : 'text-white/75'}">Hesaplar</span>
          </button>

              <button type="button" onclick="navigateWithLoader('fx')" class="w-full p-4 flex items-center justify-between hover:bg-gray-50 active:bg-gray-100 transition">
                <div class="flex items-center gap-3">
                  <div class="w-9 h-9 rounded-full bg-gray-100 flex items-center justify-center text-gray-700">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                  </div>
                  <span class="font-bold text-[#181716] text-sm">Döviz Al</span>
                </div>
                <span class="text-gray-400 font-bold">›</span>
              </button>
            </div>

          </div>

          ${renderBottomNav('accounts')}
        </div>
      `;
    }

    function renderAccountTxScreen() {
      return `
        <div class="flex-1 flex flex-col bg-[#f7f8f7] overflow-hidden">
          ${renderTopSafeArea('light')}

          <div class="w-full px-4 py-3 flex items-center justify-between bg-[#f7f8f7] z-20 text-[#181716]">
            <button type="button" onclick="navigateWithLoader('account_detail')" class="w-8 h-8 flex items-center justify-center text-2xl font-normal">‹</button>
            <h1 class="text-[17px] font-bold tracking-tight">Hesap Hareketleri</h1>
            <button type="button" onclick="triggerActionWithLoader(() => showToast('Paylaş / İndir'))" class="w-8 h-8 flex items-center justify-center">
              <svg class="w-5 h-5 text-[#181716]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
            </button>
          </div>

          <div class="flex-1 bg-[#f7f8f7] p-4 overflow-y-auto no-scrollbar space-y-4">
            
            <div class="bg-white rounded-3xl p-4 shadow-sm space-y-1">
              <p class="font-extrabold text-[#181716] text-[15px]">Vadesiz TL Hesap</p>
              <p class="text-[13px] text-gray-600">Vadesiz TL Hesap - 95830732 - 355</p>
              <p class="text-[13px] font-semibold text-[#181716] pt-1">Hesap Bakiyesi: 50,00 TL</p>
            </div>

            <div class="flex items-center gap-2">
              <div class="flex-1 bg-white rounded-2xl px-4 py-3 border border-gray-200 text-sm text-gray-400 flex items-center shadow-sm">
                İşlem Ara
              </div>
              <button type="button" onclick="triggerActionWithLoader(() => showToast('Filtreleme seçenekleri'))" class="w-12 h-12 rounded-2xl bg-white border border-gray-200 flex items-center justify-center text-gray-700 shadow-sm active:scale-95">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/></svg>
              </button>
            </div>

            <div class="space-y-3 pt-2">
              <p class="text-[13px] font-bold text-[#181716] px-1">Son 1 Hafta</p>

              <!-- Düzenlenen işlem: 65.000,00 TL Keziban beganoğlu, tek satır clamp ile alt satıra kaymaz -->
              <div onclick="navigateWithLoader('transaction_detail')" class="bg-white rounded-2xl p-4 shadow-sm space-y-1.5 cursor-pointer hover:border-[#179c47] border border-transparent transition">
                <div class="flex items-center justify-between gap-2">
                  <p class="text-[13px] font-medium text-[#181716] single-line-clamp flex-1">Keziban beganoğlu Açk: 65000.00 TRY</p>
                  <span class="text-[13px] font-extrabold text-[#181716] shrink-0">-65.000,00 TL</span>
                </div>
                <p class="text-[11px] text-gray-500">24.11.2026, 16:40</p>
              </div>

              <div onclick="triggerActionWithLoader(() => showToast('Dekont detayları görüntülendi'))" class="bg-white rounded-2xl p-4 shadow-sm space-y-1.5 cursor-pointer">
                <div class="flex items-center justify-between gap-2">
                  <p class="text-[13px] font-medium text-[#181716] single-line-clamp flex-1">Gönderen Adı:ABDULLAH KARABAC...</p>
                  <span class="text-[13px] font-extrabold text-[#179c47] shrink-0">+300,00 TL</span>
                </div>
                <p class="text-[11px] text-gray-500">23.11.2026, 18:59</p>
              </div>
            </div>

          </div>

          ${renderBottomNav('accounts')}
        </div>
      `;
    }

    // 2047.jpg ekran görüntüsüyle birebir uyumlu "Açıklama" (İşlem Detay) ekranı
    function renderTransactionDetailScreen() {
      return `
        <div class="flex-1 flex flex-col bg-[#f7f8f7] overflow-hidden">
          ${renderTopSafeArea('light')}

          <div class="w-full px-4 py-3 flex items-center justify-between bg-[#f7f8f7] z-20 text-[#181716]">
            <button type="button" onclick="navigateWithLoader('account_tx')" class="w-8 h-8 flex items-center justify-center text-2xl font-normal">‹</button>
            <h1 class="text-[17px] font-bold tracking-tight">Açıklama</h1>
            <div class="w-8"></div>
          </div>

          <div class="flex-1 bg-white rounded-t-[28px] p-5 overflow-y-auto no-scrollbar space-y-5 shadow-sm">
            
            <div>
              <p class="text-xs text-gray-400 font-medium">İşlem Tutarı</p>
              <p class="text-[18px] font-bold text-[#181716] mt-1">-65.000,00 TL</p>
            </div>
            <hr class="border-gray-100" />

            <div>
              <p class="text-xs text-gray-400 font-medium">İşlem Tarihi</p>
              <p class="text-[15px] font-medium text-[#181716] mt-1">24.11.2026, 16:40</p>
            </div>
            <hr class="border-gray-100" />

            <div>
              <p class="text-xs text-gray-400 font-medium">Açıklama</p>
              <p class="text-[15px] font-medium text-[#181716] mt-1">Keziban beganoğlu Açk: 65000.00 TRY Gönd.</p>
            </div>
            <hr class="border-gray-100" />

            <div>
              <p class="text-xs text-gray-400 font-medium">Hesap</p>
              <p class="text-[15px] font-medium text-[#181716] mt-1">Vadesiz Hesap</p>
            </div>

          </div>

          <div class="bg-white p-4 border-t border-gray-100 shrink-0">
            <button
              type="button"
              onclick="triggerActionWithLoader(() => showToast('Dekont indiriliyor / görüntüleniyor'))"
              class="w-full py-3.5 rounded-xl bg-[#1e1d1c] text-[#00e600] font-bold text-[15px] flex items-center justify-center shadow active:scale-[0.99] transition"
            >
              Dekont Görüntüle
            </button>
          </div>
        </div>
      `;
    }

    function renderSecondaryScreen(type) {
      if (type === 'accounts') return renderAccountsScreen();
      if (type === 'account_detail') return renderAccountDetailScreen();
      if (type === 'account_tx') return renderAccountTxScreen();
      if (type === 'transaction_detail') return renderTransactionDetailScreen();

      const titles = {
        transfer: 'Para Transferi',
        payments: 'Ödemeler',
        fx: 'ON FX Canlı Kurlar'
      };

      return `
        <div class="flex-1 flex flex-col bg-[#f7f8f7] overflow-hidden">
          ${renderTopSafeArea('light')}
          ${renderTopHeader('home')}
          <div class="flex-1 bg-[#f7f8f7] p-4 overflow-y-auto no-scrollbar">
            <div class="flex items-center justify-between mb-4">
              <h1 class="text-[#181716] font-extrabold text-xl">${titles[type] || 'İşlemler'}</h1>
              <button type="button" onclick="navigateWithLoader('home')" class="text-xs font-bold text-[#159e26] bg-[#159e26]/10 px-3 py-1.5 rounded-lg active:scale-95">Ana Sayfa</button>
            </div>
            ${type === 'fx' ? `
              <div class="space-y-3">
                <div class="bg-white rounded-2xl p-4 shadow-sm flex items-center justify-between">
                  <div>
                    <p class="font-bold text-[#181716]">USD / TRY</p>
                    <p class="text-xs text-gray-500">7/24 Dar Makas</p>
                  </div>
                  <div class="text-right">
                    <p class="font-extrabold text-[#159e26]">Alış: 34,42</p>
                    <p class="font-bold text-[#181716] text-xs">Satış: 34,48</p>
                  </div>
                </div>
                <div class="bg-white rounded-2xl p-4 shadow-sm flex items-center justify-between">
                  <div>
                    <p class="font-bold text-[#181716]">EUR / TRY</p>
                    <p class="text-xs text-gray-500">7/24 Dar Makas</p>
                  </div>
                  <div class="text-right">
                    <p class="font-extrabold text-[#159e26]">Alış: 36,85</p>
                    <p class="font-bold text-[#181716] text-xs">Satış: 36,92</p>
                  </div>
                </div>
              </div>
            ` : `
              <div class="bg-white rounded-2xl p-4 shadow-sm space-y-3">
                <p class="text-xs text-gray-600 leading-relaxed">Seçilen işlem modülü aktif durumdadır.</p>
                <button
                  type="button"
                  onclick="triggerActionWithLoader(() => showToast('İşlem başlatıldı'))"
                  class="w-full py-3 rounded-xl bg-[#00e600] text-[#141312] font-bold text-sm active:scale-[0.99] transition"
                >
                  Yeni İşlem Başlat
                </button>
              </div>
            `}
          </div>
          ${renderBottomNav(type === 'fx' ? 'home' : type)}
        </div>
      `;
    }

    function renderTransitionOverlay() {
      if (!state.isTransitioning) return '';
      return `
        <div class="absolute inset-0 bg-[#1f1e1d]/55 backdrop-blur-[1px] z-50 flex items-center justify-center">
          <div class="green-spinner"></div>
        </div>
      `;
    }

    function renderToast() {
      if (!state.toastMessage) return '';
      return `
        <div class="absolute top-14 left-4 right-4 z-50 flex justify-center pointer-events-none fade-in-up">
          <div class="bg-[#181716] text-white text-xs font-medium px-4 py-2.5 rounded-xl shadow-xl border border-white/10">
            ${state.toastMessage}
          </div>
        </div>
      `;
    }

    function render() {
      try {
        const root = document.getElementById('app');
        if (!root) return;

        let viewHtml = '';
        switch (state.screen) {
          case 'splash':
            viewHtml = renderSplashScreen();
            break;
          case 'login':
            viewHtml = renderLoginScreen();
            break;
          case 'loading_green':
            viewHtml = renderLoadingScreen('green');
            break;
          case 'loading_ring':
            viewHtml = renderLoadingScreen('ring');
            break;
          case 'home':
            viewHtml = renderHomeScreen();
            break;
          case 'accounts':
          case 'account_detail':
          case 'account_tx':
          case 'transaction_detail':
          case 'transfer':
          case 'payments':
          case 'fx':
            viewHtml = renderSecondaryScreen(state.screen);
            break;
          default:
            viewHtml = renderLoginScreen();
        }

        root.innerHTML = viewHtml + renderTransitionOverlay() + renderToast();
      } catch (err) {
        console.error('Uygulama render hatası:', err);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      render();
      startSplashFlow();
    });
  </script>
</body>
</html>
